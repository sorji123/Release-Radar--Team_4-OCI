name: Publish review demo

on:
  push:
    branches: [main, feature/rubric-readiness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Verify release review
        run: |
          python -m unittest discover -s tests -v
          node tests/web/core.test.mjs
          python -m release_radar build-site
          git diff --exit-code -- web/rr-data.js
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified browser assets
        id: deployment
        uses: actions/deploy-pages@v5.0.1
