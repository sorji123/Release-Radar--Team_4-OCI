name: Publish demo preview

on:
  push:
    branches: [feature/apex-live-demo, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-radar-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate pipeline and prepared browser data
        run: python -m unittest discover -s tests -v
      - name: Build synthetic demo dataset
        run: python scripts/build_demo_data.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the public web assets
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
